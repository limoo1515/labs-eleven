name: eleven_studio
description: Professional Text-to-Voice studio powered by ElevenLabs API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.3
  http: ^1.2.0
  just_audio: ^0.9.40
  provider: ^6.1.2
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.11

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0A0A0F"
  image: "assets/splash.png"
  fullscreen: true
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/
